data_cfg:
  dataset_name: CASIA-B
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  dataset_root: /home/s18/Desktop/FastGait/FastPoseGait/datasets/CASIA-B/CASIA-B_HRNet
  test_dataset_name: CASIA-B
  num_workers: 4
  remove_no_gallery: false

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 40000  # 40000 체크포인트 사용
  save_name: GPGait_PlusPlus
  sampler:
    batch_size: 1
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc
  eval_func: evaluate_indoor_dataset
  transform:
    - type: Compose
      trf_cfg:
        - type: RescaleCenter
        - type: HOD_MultiInput
          joint_format: coco
        - type: SkeletonInput

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.3
    type: TripletLoss
    log_prefix: triplet
    is_hard_loss: true
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
    label_smooth: false

model_cfg:
  model: GPGait_PlusPlus
  in_channels:
    - 2
    - 64
    - 64
    - 128
    - 256
  num_class: 74
  share_num: 3
  mask: true

optimizer_cfg:
  lr: 0.001
  momentum: 0.9
  solver: Adam
  weight_decay: 0.00002

scheduler_cfg:
  three_phase: True
  max_lr: 0.001
  div_factor: 100
  total_steps: 40000  # 40000으로 변경
  pct_start: 0.475
  scheduler: OneCycleLR

trainer_cfg:
  enable_float16: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 40000  # 40000 체크포인트 로드
  save_iter: 10000
  save_name: GPGait_PlusPlus
  sync_BN: true
  total_iter: 40000  # 40000으로 변경
  optimizer_reset: false
  scheduler_reset: false
  sampler:
    batch_shuffle: false
    batch_size:
      - 4
      - 8
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RescaleCenter
        - type: InversePosesPre
          probability: 0.1
        - type: JointNoise
          std: 0.3
        - type: HOD_MultiInput
          joint_format: coco
        - type: SkeletonInput