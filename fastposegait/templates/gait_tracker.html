<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 보행 인식 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .video-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 ratio */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .stats-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .current-person {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .person-id {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .person-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .status-new {
            background: #ffd700;
            color: #000;
        }
        
        .status-matched {
            background: #00ff00;
            color: #000;
        }
        
        .metrics-container {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .metric-row {
            margin-bottom: 12px;
        }
        
        .metric-label {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .metric-bar {
            height: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        
        .metric-fill {
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
        }
        
        .metric-fill.cosine {
            background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #00ff00 100%);
        }
        
        .metric-fill.euclidean {
            background: linear-gradient(90deg, #00ff00 0%, #ffaa00 50%, #ff4444 100%);
        }
        
        .metric-value {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .person-list {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .person-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .person-item-id {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .person-item-info {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .alerts-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .alert-item {
            background: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .alert-stalking {
            border-left-color: #ff0000;
        }
        
        .alert-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 0 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .recent-recognitions {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .recognition-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .no-data {
            text-align: center;
            opacity: 0.5;
            padding: 30px;
            font-style: italic;
        }
        
        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚶 실시간 보행 인식 시스템</h1>
            <p class="subtitle">GPGait++ 딥러닝 기반 Person Re-Identification</p>
        </header>
        
        <div class="main-content">
            <!-- 비디오 영역 -->
            <div class="video-section">
                <h2 style="margin-bottom: 15px;">📹 Live Stream</h2>
                <div class="video-container">
                    <img src="{{ url_for('video_feed') }}" alt="Video Stream">
                </div>
                
                <div class="controls">
                    <button class="btn btn-danger" onclick="resetRegistry()">🔄 Registry 리셋</button>
                </div>
            </div>
            
            <!-- 통계 및 정보 영역 -->
            <div class="stats-section">
                <h2 style="margin-bottom: 15px;">📊 실시간 통계</h2>
                
                <div class="stat-card">
                    <h3>FPS (Frames Per Second)</h3>
                    <div class="stat-value" id="fps">0</div>
                </div>
                
                <div class="stat-card">
                    <h3>처리된 프레임</h3>
                    <div class="stat-value" id="processed-frames">0</div>
                </div>
                
                <div class="stat-card">
                    <h3>스켈레톤 검출률</h3>
                    <div class="stat-value" id="detection-rate">0%</div>
                </div>
                
                <div class="stat-card">
                    <h3>모델 추론 횟수</h3>
                    <div class="stat-value" id="inference-count">0</div>
                </div>
                
                <h2 style="margin: 20px 0 15px 0;">👤 현재 인식 중</h2>
                <div id="current-person" class="current-person">
                    <div class="no-data">인식 대기 중...</div>
                </div>
                
                <h2 style="margin: 20px 0 15px 0;">👥 등록된 인물 ({}<span id="person-count">0</span>명)</h2>
                <div class="person-list" id="person-list">
                    <div class="no-data">등록된 인물이 없습니다</div>
                </div>
            </div>
        </div>
        
        <!-- 알림 및 최근 인식 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="alerts-section">
                <h2 style="margin-bottom: 15px;">⚠️ 알림</h2>
                <div id="alerts">
                    <div class="no-data">알림 없음</div>
                </div>
            </div>
            
            <div class="alerts-section">
                <h2 style="margin-bottom: 15px;">📝 최근 인식 기록</h2>
                <div class="recent-recognitions" id="recent-recognitions">
                    <div class="no-data">인식 기록 없음</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 데이터 업데이트 (1초마다)
        setInterval(updateStats, 1000);
        
        function updateStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    // 통계 업데이트
                    document.getElementById('fps').textContent = data.stats.fps;
                    document.getElementById('processed-frames').textContent = data.stats.processed_frames;
                    document.getElementById('inference-count').textContent = data.stats.inference_count;
                    
                    // 검출률 계산
                    const detectionRate = data.stats.processed_frames > 0 
                        ? ((data.stats.detected_frames / data.stats.processed_frames) * 100).toFixed(1)
                        : 0;
                    document.getElementById('detection-rate').textContent = detectionRate + '%';
                    
                    // 현재 인물
                    const currentPersonDiv = document.getElementById('current-person');
                    if (data.current_person) {
                        const person = data.current_person;
                        const statusClass = person.is_new ? 'status-new' : 'status-matched';
                        const statusText = person.is_new ? 'NEW' : 'MATCHED';
                        
                        const cosine = person.cosine_similarity || 0;
                        const euclidean = person.euclidean_distance || 0;
                        
                        // 코사인 유사도: 0~1 (높을수록 좋음)
                        const cosinePercent = (cosine * 100).toFixed(1);
                        const cosineColor = cosine >= 0.92 ? '#00ff00' : cosine >= 0.85 ? '#ffaa00' : '#ff4444';
                        
                        // 유클리드 거리: 0~무한 (낮을수록 좋음, 0.35 이하가 목표)
                        const euclideanPercent = Math.min(100, (euclidean / 0.5) * 100).toFixed(1);
                        const euclideanColor = euclidean <= 0.35 ? '#00ff00' : euclidean <= 0.5 ? '#ffaa00' : '#ff4444';
                        
                        currentPersonDiv.innerHTML = `
                            <div class="person-id">Person #${person.id}</div>
                            <div class="person-status ${statusClass}">${statusText}</div>
                            <div style="margin-top: 10px; font-size: 0.9rem;">
                                Match Score: <strong>${person.match_score.toFixed(3)}</strong><br>
                                Time: ${person.timestamp}
                            </div>
                            
                            <div class="metrics-container">
                                <div class="metric-row">
                                    <div class="metric-label">🎯 코사인 유사도 (높을수록 좋음)</div>
                                    <div class="metric-bar">
                                        <div class="metric-fill cosine" style="width: ${cosinePercent}%; background: ${cosineColor};">
                                            ${cosine.toFixed(4)}
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="metric-row">
                                    <div class="metric-label">📏 유클리드 거리 (낮을수록 좋음)</div>
                                    <div class="metric-bar">
                                        <div class="metric-fill euclidean" style="width: ${euclideanPercent}%; background: ${euclideanColor};">
                                            ${euclidean.toFixed(4)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        currentPersonDiv.innerHTML = '<div class="no-data">인식 대기 중...</div>';
                    }
                    
                    // 인물 리스트
                    const personListDiv = document.getElementById('person-list');
                    document.getElementById('person-count').textContent = data.person_list.length;
                    
                    if (data.person_list.length > 0) {
                        personListDiv.innerHTML = data.person_list.map(person => `
                            <div class="person-item">
                                <div>
                                    <div class="person-item-id">Person #${person.id}</div>
                                    <div class="person-item-info">
                                        감지 횟수: ${person.count}회 | 경과시간: ${person.duration.toFixed(1)}s
                                    </div>
                                </div>
                                <div style="text-align: right; font-size: 0.85rem;">
                                    Score: ${person.match_score.toFixed(3)}<br>
                                    Cos: ${(person.cosine_similarity || 0).toFixed(3)} | Euc: ${(person.euclidean_distance || 0).toFixed(3)}<br>
                                    최근: ${person.last_seen}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        personListDiv.innerHTML = '<div class="no-data">등록된 인물이 없습니다</div>';
                    }
                    
                    // 알림
                    const alertsDiv = document.getElementById('alerts');
                    if (data.alerts.length > 0) {
                        alertsDiv.innerHTML = data.alerts.map(alert => `
                            <div class="alert-item alert-${alert.type}">
                                <strong>⚠️ ${alert.message}</strong>
                                <div class="alert-time">${alert.timestamp}</div>
                            </div>
                        `).join('');
                    } else {
                        alertsDiv.innerHTML = '<div class="no-data">알림 없음</div>';
                    }
                    
                    // 최근 인식 기록
                    const recognitionsDiv = document.getElementById('recent-recognitions');
                    if (data.recent_recognitions.length > 0) {
                        recognitionsDiv.innerHTML = data.recent_recognitions.map(rec => `
                            <div class="recognition-item">
                                <div>
                                    <strong>Person #${rec.person_id}</strong> - ${rec.status}
                                </div>
                                <div style="text-align: right;">
                                    ${rec.match_score.toFixed(3)}<br>
                                    <span style="font-size: 0.8rem; opacity: 0.7;">${rec.timestamp}</span>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        recognitionsDiv.innerHTML = '<div class="no-data">인식 기록 없음</div>';
                    }
                })
                .catch(error => console.error('Error fetching stats:', error));
        }
        
        function resetRegistry() {
            if (confirm('정말로 Registry를 리셋하시겠습니까? 모든 등록된 인물 데이터가 삭제됩니다.')) {
                fetch('/api/reset')
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        updateStats();
                    })
                    .catch(error => console.error('Error resetting registry:', error));
            }
        }
        
        // 초기 로드
        updateStats();
    </script>
</body>
</html>
